<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f1115" />
<title>Rep Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #222630;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #4f9dff;
    --accent2: #34d399;
    --danger: #f87171;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .index-num { font-size: 44px; font-weight: 700; line-height: 1; }
  .index-label { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .headline { display: flex; gap: 12px; align-items: stretch; }
  .hl-item { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .load-tile { background: #fff; border-radius: 14px; padding: 12px 6px; }
  .load-tile .index-label { color: #555; }
  .load-tile .rd { color: #666; font-size: 11px; margin-top: 3px; }
  .index-delta { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .up { color: var(--accent2); } .down { color: #f87171; } .flat { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 16px; }
  .stat { background: var(--card2); border-radius: 11px; padding: 8px 4px; min-width: 0; }
  .stat .lab { color: var(--muted); font-size: 10px; line-height: 1.15; }
  .stat .base { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .stat .delt { font-size: 10px; font-weight: 600; margin-top: 2px; line-height: 1.15; }
  .stat .rd { font-size: 9px; color: var(--muted); margin-top: 2px; line-height: 1.1; }
  .htabs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .htab { flex: 1; padding: 6px; text-align: center; background: var(--card2); border-radius: 9px;
    color: var(--muted); font-size: 12px; }
  .htab.active { background: var(--accent); color: #fff; }
  .exercise { margin-bottom: 14px; }
  .exercise-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .exercise-name { font-weight: 600; font-size: 16px; }
  .exercise-today { color: var(--muted); font-size: 13px; }
  .btn-row { display: flex; gap: 8px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .repbtn { flex: 1; background: var(--card2); color: var(--text); font-size: 17px; font-weight: 600;
    padding: 16px 0; border-radius: 12px; transition: transform .05s, background .15s; }
  .repbtn:active { transform: scale(0.95); background: var(--accent); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; padding: 8px; text-align: center; background: var(--card2); border-radius: 10px;
    color: var(--muted); font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; }
  canvas { width: 100%; height: 200px; }
  .row { display: flex; gap: 8px; }
  .small { font-size: 12px; color: var(--muted); }
  .link { background: none; color: var(--accent); font-size: 13px; padding: 6px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent2); color: #062; padding: 10px 18px; border-radius: 999px;
    font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .manage { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  input[type=text], input[type=number] { background: var(--card2); border: 1px solid #333; color: var(--text);
    border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; }
  .addbtn { background: var(--accent2); color: #063; font-weight: 600; padding: 10px 14px; border-radius: 10px; }
  .del { background: none; color: #f87171; font-size: 20px; padding: 4px 8px; }
  .logrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #262b35; font-size: 13px; }
  .logwhen { color: var(--muted); width: 104px; flex-shrink: 0; }
  .logname { flex: 1; }
  .logreps { font-weight: 700; color: var(--accent2); }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>💪 Rep Tracker</h1>
  <div class="sub" id="datestr"></div>

  <div class="card">
    <div class="headline">
      <div class="hl-item">
        <div class="index-num" id="indexNum">0</div>
        <div class="index-label">Today's Index</div>
      </div>
      <div class="hl-item load-tile">
        <div class="index-num" id="loadNum">–</div>
        <div class="index-label">Load 7d ÷ 28d</div>
        <div class="rd" id="loadDetail"></div>
      </div>
    </div>
    <div class="stats" id="statsRow"></div>
  </div>

  <div class="card" id="exercises"></div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-chart="index">Index</div>
      <div class="tab" data-chart="volume">Daily reps</div>
      <div class="tab" data-chart="perex">By exercise</div>
    </div>
    <div class="htabs" id="horizons">
      <div class="htab" data-days="7">1 week</div>
      <div class="htab active" data-days="14">2 weeks</div>
      <div class="htab" data-days="30">1 month</div>
      <div class="htab" data-days="90">3 months</div>
    </div>
    <canvas id="chart"></canvas>
    <div class="small" id="chartLegend" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <canvas id="dayCumChart"></canvas>
    <div class="small" id="dayCumLegend" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="htabs" id="monthModes">
      <div class="htab active" data-mm="index">Monthly index</div>
      <div class="htab" data-mm="reps">Monthly reps</div>
    </div>
    <canvas id="monthChart"></canvas>
    <div class="small" id="monthLegend" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <canvas id="weekCumChart"></canvas>
    <div class="small" id="weekCumLegend" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <canvas id="monthCumChart"></canvas>
    <div class="small" id="monthCumLegend" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="small" style="margin-bottom:8px">Manage exercises</div>
    <div class="manage">
      <input type="text" id="newName" placeholder="Name (e.g. Squats)" style="flex:2" />
      <input type="number" id="newWeight" placeholder="Wt" value="1" step="0.1" style="width:64px" />
      <button class="addbtn" id="addEx">Add</button>
    </div>
    <div class="small" style="margin-top:6px">Weight = how much each rep counts toward your index.</div>
    <div id="exList" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px; justify-content:space-between">
      <button class="link" id="exportBtn">Export data (JSON)</button>
      <button class="link" id="importBtn">Import</button>
      <button class="link" style="color:#f87171" id="undoBtn">Undo last</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>

  <div class="card">
    <div class="small" style="margin-bottom:8px">Activity log <span id="logCount"></span></div>
    <div id="logList"></div>
    <button class="link" id="logMore" style="display:none; width:100%; text-align:center; margin-top:8px">Show more</button>
  </div>

  <footer>Data is stored only on this device. Export regularly to back up.</footer>
  <div class="toast" id="toast"></div>

<script>
const STORE = "reptracker_v1";
const DEFAULT = {
  exercises: [
    { id: "dip",      name: "Dips",           weight: 1.5,  increments: [1,5,10] },
    { id: "pullup",   name: "Pull-ups",       weight: 3.0,  increments: [1,5,10] },
    { id: "burpee",   name: "Burpees",        weight: 3.0,  increments: [1,5,10] },
    { id: "jumpsquat",name: "Jumping Squats", weight: 1.8,  increments: [1,5,10] },
    { id: "pushups",  name: "Press-ups",      weight: 1.0,  increments: [1,5,10] },
    { id: "hang60",   name: "60s Hang",       weight: 38.0, increments: [1,5] },
    { id: "hang80",   name: "80s Hang",       weight: 66.0, increments: [1,5] },
    { id: "hang90",   name: "90s Hang",       weight: 83.0, increments: [1,5] },
    { id: "lunge",    name: "Lunges",         weight: 0.6,  increments: [1,5,10] },
    { id: "squats",   name: "Squats",         weight: 0.8,  increments: [1,5,10] },
    { id: "hang30",   name: "30s Hang",       weight: 10.0, increments: [1,5] },
    { id: "hang45",   name: "45s Hang",       weight: 22.0, increments: [1,5] },
    { id: "curls",    name: "Curls",          weight: 0.5,  increments: [1,5,10] },
  ],
  log: [] // { t: epoch_ms, ex: id, reps: n }
};

let state = load();
let chartMode = "index";
let chartDays = 14;
let monthMode = "index";
let logShown = 50;
const CUM_SINCE = "2026-07-01";  // time-of-day baselines only look back this far

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.exercises) return s; } catch(e){}
  return structuredClone(DEFAULT);
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }

function dayKey(ms) { const d = new Date(ms); return d.toISOString().slice(0,10); }
function todayKey() { return dayKey(Date.now()); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1200);
}

function addRep(exId, reps) {
  state.log.push({ t: Date.now(), ex: exId, reps });
  save();
  const ex = state.exercises.find(e=>e.id===exId);
  toast(`+${reps} ${ex ? ex.name : ""}`);
  render();
  if (navigator.vibrate) navigator.vibrate(15);
}

function undoLast() {
  if (!state.log.length) { toast("Nothing to undo"); return; }
  const last = state.log.pop(); save();
  const ex = state.exercises.find(e=>e.id===last.ex);
  toast(`Removed ${last.reps} ${ex?ex.name:""}`);
  render();
}

// ---- aggregation ----
function dailyIndex() {
  const byDay = {};
  for (const e of state.log) {
    const ex = state.exercises.find(x=>x.id===e.ex);
    const w = ex ? ex.weight : 1;
    const k = dayKey(e.t);
    byDay[k] = (byDay[k]||0) + e.reps * w;
  }
  return byDay;
}
function dailyReps() {
  const byDay = {};
  for (const e of state.log) { const k = dayKey(e.t); byDay[k] = (byDay[k]||0) + e.reps; }
  return byDay;
}
function todayTotals() {
  const tk = todayKey(); const per = {};
  for (const e of state.log) if (dayKey(e.t)===tk) per[e.ex] = (per[e.ex]||0) + e.reps;
  return per;
}
function lastNDays(n) {
  const days = [];
  for (let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  return days;
}
function monthKey(ms){ return dayKey(ms).slice(0,7); }
function monthlyTotals(metric) {
  const by = {};
  for (const e of state.log) {
    const ex = state.exercises.find(x=>x.id===e.ex); const w = ex?ex.weight:1;
    const k = monthKey(e.t);
    by[k] = (by[k]||0) + (metric==="index" ? e.reps*w : e.reps);
  }
  return by;
}
function lastNMonths(n) {
  const [Y,M] = todayKey().split("-").map(Number); // M: 1-12
  const arr = [];
  for (let i=n-1;i>=0;i--){ let y=Y, m=M-i; while(m<=0){m+=12;y--;} arr.push(y+"-"+String(m).padStart(2,"0")); }
  return arr;
}

// ---- rendering ----
function render() {
  document.getElementById("datestr").textContent =
    new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});

  // index card
  const idx = dailyIndex();
  const tk = todayKey();
  const todayIdx = Math.round(idx[tk]||0);
  document.getElementById("indexNum").textContent = todayIdx;

  // intensity / load ratio (ACWR): 7-day avg ÷ 28-day avg of daily index (completed days)
  const meanPrev = n => { const ds=lastNDays(n+1).slice(0,n); return ds.reduce((a,d)=>a+(idx[d]||0),0)/n; };
  const load7 = meanPrev(7), load28 = meanPrev(28), loadR = load28>0 ? load7/load28 : null;
  const loadEl = document.getElementById("loadNum");
  if (loadR==null){ loadEl.textContent="–"; loadEl.style.color="#999"; }
  else { loadEl.textContent=loadR.toFixed(2);
    loadEl.style.color = loadR<1.3 ? "#16a34a" : loadR<=1.5 ? "#f59e0b" : "#dc2626"; }
  document.getElementById("loadDetail").textContent = "7d "+Math.round(load7)+" · 28d "+Math.round(load28);

  // ---- baselines over full history (calendar days, incl rest days) ----
  const rep = dailyReps();
  const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const WS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const todayW = new Date(tk+"T12:00:00Z").getUTCDay();
  const repsToday = rep[tk] || 0;
  const wOf = id => { const ex=state.exercises.find(x=>x.id===id); return ex?ex.weight:1; };
  const todSec = t => { const d=new Date(t); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); };

  // time of today's most recent submission -> cumulative-by-that-time comparisons
  let lastSubSec=null, lastSubLabel="";
  const todayEntries = state.log.filter(e=>dayKey(e.t)===tk);
  if (todayEntries.length){ const lt=Math.max(...todayEntries.map(e=>e.t));
    lastSubSec=todSec(lt); lastSubLabel=new Date(lt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
  const dayCumAt = {};
  if (lastSubSec!=null) for (const e of state.log){ if (dayKey(e.t)===tk) continue;
    if (todSec(e.t)<=lastSubSec){ const k=dayKey(e.t); dayCumAt[k]=(dayCumAt[k]||0)+e.reps*wOf(e.ex); } }

  // single pass over calendar days (first activity .. yesterday) for averages + records
  let minT=Infinity; for (const e of state.log) if (e.t<minT) minT=e.t;
  let dCnt=0, wdCnt=0, sIdx=0, sIdxWD=0, sRepsWD=0, recDay=0, recWD=0;
  let dCntC=0, wdCntC=0, sCumC=0, sCumWDC=0;   // time-of-day baselines: only days >= CUM_SINCE
  if (minT<Infinity){
    const end=new Date(tk+"T00:00:00Z");
    for (let d=new Date(dayKey(minT)+"T00:00:00Z"); d<end; d.setUTCDate(d.getUTCDate()+1)){
      const k=d.toISOString().slice(0,10), w=d.getUTCDay(), vi=idx[k]||0;
      const inWin = k>=CUM_SINCE;
      dCnt++; sIdx+=vi; if (vi>recDay) recDay=vi;
      if (lastSubSec!=null && inWin){ dCntC++; sCumC+=dayCumAt[k]||0; }
      if (w===todayW){ wdCnt++; sIdxWD+=vi; sRepsWD+=rep[k]||0; if (vi>recWD) recWD=vi;
        if (lastSubSec!=null && inWin){ wdCntC++; sCumWDC+=dayCumAt[k]||0; } }
    }
  }
  const avgDaily  = dCnt? sIdx/dCnt : 0;
  const avgWD     = wdCnt? sIdxWD/wdCnt : 0;
  const avgRepsWD = wdCnt? sRepsWD/wdCnt : 0;
  const avgCum    = (lastSubSec!=null && dCntC)? sCumC/dCntC : null;
  const avgCumWD  = (lastSubSec!=null && wdCntC)? sCumWDC/wdCntC : null;

  // ---- delta renderers ----
  const deltaCur = (cur, base) => {
    if (!(base>0)) return '<span class="delt flat">no baseline</span>';
    const p=Math.round((cur-base)/base*100), abs=Math.round(cur-base);
    return `<span class="delt ${p>2?'up':p<-2?'down':'flat'}">${p>=0?'▲ +':'▼ '}${p}% (${abs>=0?'+':''}${abs.toLocaleString()})</span>`;
  };
  const deltaFull = base => deltaCur(todayIdx, base);
  const recDelt = (todayIdx>0 && recDay>0 && todayIdx>=Math.round(recDay)) ? '🏆 '+deltaFull(recDay) : deltaFull(recDay);
  const tile = (label, base, over, det) =>
    `<div class="stat"><div class="lab">${label}</div><div class="base">${Math.round(base).toLocaleString()}</div>${over||deltaFull(base)}${det?`<div class="rd">${det}</div>`:""}</div>`;
  const cumTile = (label, avg, det) => avg==null
    ? `<div class="stat"><div class="lab">${label}</div><div class="base">—</div><span class="delt flat">no entry yet</span></div>`
    : `<div class="stat"><div class="lab">${label}</div><div class="base">${Math.round(avg).toLocaleString()}</div>${deltaCur(todayIdx,avg)}<div class="rd">${det}</div></div>`;

  // ---- week / month sums ----
  const sumRange = (from, toIncl) => { let s=0; const d=new Date(from);
    while (d<=toIncl){ s += idx[d.toISOString().slice(0,10)]||0; d.setUTCDate(d.getUTCDate()+1); } return s; };
  const now = new Date(tk+"T00:00:00Z");
  const isoOff = (now.getUTCDay()+6)%7;
  const thisMon = new Date(now); thisMon.setUTCDate(now.getUTCDate()-isoOff);
  const thisMonKey = thisMon.toISOString().slice(0,10);
  const lastMon = new Date(thisMon); lastMon.setUTCDate(thisMon.getUTCDate()-7);
  const lastSun = new Date(thisMon); lastSun.setUTCDate(thisMon.getUTCDate()-1);
  const wkNow = sumRange(thisMon, now), wkPrev = sumRange(lastMon, lastSun);
  const prevWkSame = new Date(now); prevWkSame.setUTCDate(now.getUTCDate()-7);
  const wkTDprev = sumRange(lastMon, prevWkSame);
  const [Y,Mo] = tk.split("-").map(Number);
  const dom = now.getUTCDate();
  const daysPrevMo = new Date(Date.UTC(Y,Mo-1,0)).getUTCDate();
  const moNow  = sumRange(new Date(Date.UTC(Y,Mo-1,1)), now);
  const moPrev = sumRange(new Date(Date.UTC(Y,Mo-2,1)), new Date(Date.UTC(Y,Mo-1,0)));
  const moTDprev = sumRange(new Date(Date.UTC(Y,Mo-2,1)), new Date(Date.UTC(Y,Mo-2,Math.min(dom,daysPrevMo))));

  // ---- record week / record month (completed periods only) ----
  const wkTot={};
  for (const k in idx){ const d=new Date(k+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
    const mk=d.toISOString().slice(0,10); if (mk===thisMonKey) continue; wkTot[mk]=(wkTot[mk]||0)+idx[k]; }
  let recWkMon=null, recWkTotal=0; for (const mk in wkTot) if (wkTot[mk]>recWkTotal){ recWkTotal=wkTot[mk]; recWkMon=mk; }
  let recWkToDate=0, recWkLabel="";
  if (recWkMon){ const rm=new Date(recWkMon+"T00:00:00Z");
    for (let d=0; d<=isoOff; d++){ const dd=new Date(rm); dd.setUTCDate(rm.getUTCDate()+d); recWkToDate+=idx[dd.toISOString().slice(0,10)]||0; }
    recWkLabel=rm.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"2-digit"}); }
  const moTot = monthlyTotals("index"), curMonKey = tk.slice(0,7);
  let recMoKey=null, recMoTotal=0; for (const mk in moTot){ if (mk===curMonKey) continue; if (moTot[mk]>recMoTotal){ recMoTotal=moTot[mk]; recMoKey=mk; } }
  let recMoToDate=0, recMoLabel="";
  if (recMoKey){ const [ry,rmn]=recMoKey.split("-").map(Number); const daysRec=new Date(Date.UTC(ry,rmn,0)).getUTCDate();
    const upto=Math.min(dom,daysRec); for (let day=1; day<=upto; day++) recMoToDate+=idx[new Date(Date.UTC(ry,rmn-1,day)).toISOString().slice(0,10)]||0;
    recMoLabel=MN[rmn-1]+" '"+recMoKey.slice(2,4); }

  const periodTile = (label, cur, prev, det) => {
    const p = prev>0 ? Math.round(cur/prev*100) : null;
    const diff = Math.round(cur-prev);
    const base = p===null ? "—" : p+"%";
    const delt = p===null ? '<span class="delt flat">no prior</span>'
      : `<span class="delt ${diff>0?'up':diff<0?'down':'flat'}">${diff>=0?'▲ +':'▼ '}${Math.abs(diff).toLocaleString()}</span>`;
    return `<div class="stat"><div class="lab">${label}</div><div class="base">${base}</div>${delt}${det?`<div class="rd">${det}</div>`:""}</div>`;
  };

  document.getElementById("statsRow").innerHTML = `
    <div class="stat"><div class="lab">Reps today</div><div class="base">${repsToday.toLocaleString()}</div>${wdCnt?deltaCur(repsToday,avgRepsWD):""}</div>
    ${cumTile("Cum vs avg day", avgCum, "@ "+lastSubLabel)}
    ${cumTile("Cum vs avg "+WS[todayW], avgCumWD, "@ "+lastSubLabel+" "+WS[todayW])}
    ${tile("Avg "+WS[todayW]+" idx", avgWD)}
    ${tile("Avg daily idx", avgDaily)}
    ${tile("Record "+WS[todayW], recWD)}
    ${tile("Record day", recDay, recDelt)}
    ${periodTile("WTD vs last wk", wkNow, wkTDprev)}
    ${periodTile("WTD vs rec wk", wkNow, recWkToDate, recWkLabel?"rec "+recWkLabel:"")}
    ${periodTile("Week vs last", wkNow, wkPrev)}
    ${periodTile("Week vs rec", wkNow, recWkTotal, recWkLabel?"rec "+recWkLabel:"")}
    ${periodTile("MTD vs last mo", moNow, moTDprev)}
    ${periodTile("MTD vs rec mo", moNow, recMoToDate, recMoLabel?"rec "+recMoLabel:"")}
    ${periodTile("Month vs last", moNow, moPrev)}
    ${periodTile("Month vs rec", moNow, recMoTotal, recMoLabel?"rec "+recMoLabel:"")}`;

  // exercises with buttons
  const per = todayTotals();
  const cont = document.getElementById("exercises");
  cont.innerHTML = "";
  for (const ex of state.exercises) {
    const div = document.createElement("div"); div.className="exercise";
    const head = document.createElement("div"); head.className="exercise-head";
    head.innerHTML = `<span class="exercise-name">${escapeHtml(ex.name)}</span>
      <span class="exercise-today">${per[ex.id]||0} today</span>`;
    const row = document.createElement("div"); row.className="btn-row";
    for (const inc of (ex.increments||[1,5,10])) {
      const b = document.createElement("button"); b.className="repbtn"; b.textContent="+"+inc;
      b.onclick = ()=>addRep(ex.id, inc);
      row.appendChild(b);
    }
    div.appendChild(head); div.appendChild(row); cont.appendChild(div);
  }

  renderExList();
  renderLog();
  drawChart();
  drawMonthChart();
  drawCumCharts();
}

function renderExList() {
  const el = document.getElementById("exList"); el.innerHTML="";
  for (const ex of state.exercises) {
    const r = document.createElement("div"); r.className="manage"; r.style.marginTop="6px";
    r.innerHTML = `<span style="flex:2">${escapeHtml(ex.name)}</span>
      <span class="small" style="width:64px">×${ex.weight}</span>`;
    const del = document.createElement("button"); del.className="del"; del.textContent="✕";
    del.onclick = ()=>{ if(confirm("Delete "+ex.name+"? (kept log entries stay but lose their name)")){
      state.exercises = state.exercises.filter(e=>e.id!==ex.id); save(); render(); } };
    r.appendChild(del); el.appendChild(r);
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderLog() {
  const wrap = document.getElementById("logList");
  const count = document.getElementById("logCount");
  const more = document.getElementById("logMore");
  const total = state.log.length;
  count.textContent = "("+total.toLocaleString()+")";
  // newest first, keep original index for reliable deletion
  const entries = state.log.map((e,i)=>({e,i})).sort((a,b)=>b.e.t-a.e.t).slice(0, logShown);
  wrap.innerHTML = entries.map(({e,i})=>{
    const ex = state.exercises.find(x=>x.id===e.ex);
    const name = ex ? ex.name : e.ex;
    const dt = new Date(e.t);
    const when = dt.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"2-digit"})
      +" "+dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
    return `<div class="logrow"><span class="logwhen">${when}</span><span class="logname">${escapeHtml(name)}</span>`
      +`<span class="logreps">+${e.reps}</span><button class="del" data-i="${i}">✕</button></div>`;
  }).join("");
  wrap.querySelectorAll("button.del").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.i;
    if (confirm("Remove this entry?")) { state.log.splice(i,1); save(); render(); }
  });
  more.style.display = total>logShown ? "block" : "none";
  more.textContent = total>logShown ? `Show more (${(total-logShown).toLocaleString()} older)` : "";
}

// ---- chart (canvas, no deps) ----
function movingAvg(arr, w) {
  return arr.map((_,i)=>{ let s=0,c=0; for(let j=Math.max(0,i-w+1);j<=i;j++){s+=arr[j];c++;} return s/c; });
}
function drawChart() {
  const cv = document.getElementById("chart");
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const maWin = chartDays<=14 ? 3 : 7;         // 3-day MA short views, 7-day MA long views
  const extN = chartDays + maWin - 1;          // fetch extra days so MA is accurate at left edge
  const daysExt = lastNDays(extN);
  const days = daysExt.slice(extN - chartDays);
  const hLabel = chartDays<=7?"last week":chartDays<=14?"last 2 weeks":chartDays<=30?"last month":"last 3 months";
  const pad = {l:34,r:8,t:12,b:22};
  const gw = W-pad.l-pad.r, gh = H-pad.t-pad.b;
  const legend = document.getElementById("chartLegend");
  const labelEvery = Math.max(1, Math.round(days.length/6));
  const colors = ["#4f9dff","#34d399","#fbbf24","#f472b6","#a78bfa","#22d3ee","#fb923c"];
  const x = i => pad.l + gw*(i/(days.length-1));

  function axes(max) {
    ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
    ctx.fillStyle="#8b90a0"; ctx.font="10px sans-serif"; ctx.textAlign="right";
    ctx.fillText(max, pad.l-4, pad.t+8); ctx.fillText("0", pad.l-4, pad.t+gh);
    ctx.textAlign="center";
    days.forEach((d,i)=>{ if(i%labelEvery===0||i===days.length-1)
      ctx.fillText(d.slice(5), x(i), pad.t+gh+14); });
  }

  // faint daily bars + prominent moving-average line (single metric)
  function drawBarsMA(extData, barColor, lineColor) {
    const vis = extData.slice(extN - chartDays);
    const ma  = movingAvg(extData, maWin).slice(extN - chartDays);
    let max=0; for(const v of vis) if(v>max)max=v; for(const v of ma) if(v>max)max=v;
    max = Math.ceil((max||1)*1.1);
    axes(max);
    const y = v => pad.t + gh*(1 - v/max);
    const bw = Math.max(1.5, gw/days.length*0.62);
    ctx.fillStyle = barColor;
    vis.forEach((v,i)=>{ const h=gh*(v/max); ctx.fillRect(x(i)-bw/2, pad.t+gh-h, bw, h); });
    ctx.strokeStyle=lineColor; ctx.lineWidth=2.6; ctx.lineJoin="round"; ctx.beginPath();
    ma.forEach((v,i)=>{ i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v)); });
    ctx.stroke();
  }

  function drawLines(seriesList) {
    let max=0; for(const s of seriesList) for(const v of s.data) if(v>max)max=v;
    max=Math.ceil((max||1)*1.1); axes(max);
    const y=v=>pad.t+gh*(1-v/max);
    seriesList.forEach(s=>{ ctx.strokeStyle=s.color; ctx.lineWidth=2; ctx.beginPath();
      s.data.forEach((v,i)=>{ i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v)); }); ctx.stroke(); });
  }

  if (chartMode==="index") {
    const idx = dailyIndex();
    drawBarsMA(daysExt.map(d=>Math.round(idx[d]||0)), "rgba(79,157,255,0.28)", "#4f9dff");
    legend.innerHTML = `<span style="color:#4f9dff">━</span> ${maWin}-day avg &nbsp;·&nbsp; <span style="color:#4f9dff;opacity:.5">▮</span> daily index &nbsp;·&nbsp; ${hLabel}`;
  } else if (chartMode==="volume") {
    const rep = dailyReps();
    drawBarsMA(daysExt.map(d=>rep[d]||0), "rgba(52,211,153,0.28)", "#34d399");
    legend.innerHTML = `<span style="color:#34d399">━</span> ${maWin}-day avg &nbsp;·&nbsp; <span style="color:#34d399;opacity:.5">▮</span> daily reps &nbsp;·&nbsp; ${hLabel}`;
  } else {
    const series = state.exercises.map((ex,i)=>{
      const byDay={}; for(const e of state.log) if(e.ex===ex.id){const k=dayKey(e.t); byDay[k]=(byDay[k]||0)+e.reps;}
      return { color: colors[i%colors.length], name: ex.name, data: days.map(d=>byDay[d]||0) };
    });
    drawLines(series);
    legend.innerHTML = series.map(s=>`<span style="color:${s.color}">●</span> ${escapeHtml(s.name)}`).join("&nbsp;&nbsp;");
  }
}

const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function drawMonthChart() {
  const cv = document.getElementById("monthChart");
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const legend = document.getElementById("monthLegend");
  if (!state.log.length) { legend.textContent = "No data yet"; return; }
  // window = available months, capped at 24
  let minT = Infinity; for (const e of state.log) if (e.t<minT) minT=e.t;
  const [fy,fm] = monthKey(minT).split("-").map(Number);
  const [cy,cm] = todayKey().split("-").map(Number);
  const span = (cy-fy)*12 + (cm-fm) + 1;
  const N = Math.min(24, Math.max(1, span));
  const months = lastNMonths(N);
  const tot = monthlyTotals(monthMode);
  const data = months.map(k=>Math.round(tot[k]||0));
  const pad = {l:40,r:8,t:12,b:50};
  const gw = W-pad.l-pad.r, gh = H-pad.t-pad.b;
  let max=0; for (const v of data) if (v>max) max=v; max = Math.ceil((max||1)*1.1);
  ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
  ctx.fillStyle="#8b90a0"; ctx.font="10px sans-serif"; ctx.textAlign="right";
  ctx.fillText(max.toLocaleString(), pad.l-4, pad.t+8); ctx.fillText("0", pad.l-4, pad.t+gh);
  const slot = gw/months.length;
  const bw = Math.max(3, slot*0.72);
  const color = monthMode==="index" ? "#a78bfa" : "#fbbf24";
  const labelEvery = Math.max(1, Math.ceil(12/slot)); // vertical labels fit ~every month
  // bars
  data.forEach((v,i)=>{
    const cx = pad.l + slot*(i+0.5);
    const h = gh*(v/max);
    ctx.fillStyle = color; ctx.fillRect(cx-bw/2, pad.t+gh-h, bw, h);
  });
  // vertical month labels
  ctx.fillStyle="#8b90a0"; ctx.textBaseline="middle";
  for (let i=0;i<months.length;i++) {
    if (i%labelEvery!==0 && i!==months.length-1) continue;
    const cx = pad.l + slot*(i+0.5);
    const [y,m]=months[i].split("-");
    ctx.save(); ctx.translate(cx, pad.t+gh+6); ctx.rotate(-Math.PI/2);
    ctx.textAlign="right"; ctx.fillText(MN[+m-1]+" '"+y.slice(2), 0, 0); ctx.restore();
  }
  legend.textContent = (monthMode==="index"?"Monthly index total":"Monthly total reps")+" — last "+N+" month"+(N>1?"s":"");
}

// cumulative running-total series (index) for this vs previous week/month
function weekCumSeries() {
  const idx = dailyIndex();
  const now = new Date(todayKey()+"T00:00:00Z");
  const isoOff = (now.getUTCDay()+6)%7;
  const thisMon = new Date(now); thisMon.setUTCDate(now.getUTCDate()-isoOff);
  const lastMon = new Date(thisMon); lastMon.setUTCDate(thisMon.getUTCDate()-7);
  const labels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const cur=[], prev=[]; let cCur=0, cPrev=0;
  for (let d=0; d<7; d++) {
    const cd = new Date(thisMon); cd.setUTCDate(thisMon.getUTCDate()+d);
    const pd = new Date(lastMon); pd.setUTCDate(lastMon.getUTCDate()+d);
    cPrev += idx[pd.toISOString().slice(0,10)]||0; prev.push(Math.round(cPrev));
    if (cd<=now) { cCur += idx[cd.toISOString().slice(0,10)]||0; cur.push(Math.round(cCur)); } else cur.push(null);
  }
  // find the record (highest-total) completed week, excluding the current one
  const thisMonKey = thisMon.toISOString().slice(0,10);
  const weekTot = {};
  for (const k in idx) {
    const d = new Date(k+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
    const mk = d.toISOString().slice(0,10);
    if (mk===thisMonKey) continue;              // skip in-progress week
    weekTot[mk] = (weekTot[mk]||0) + idx[k];
  }
  let recMon=null, recMax=0;
  for (const mk in weekTot) if (weekTot[mk]>recMax){ recMax=weekTot[mk]; recMon=mk; }
  let rec=null, recLabel="";
  if (recMon) {
    rec=[]; let c=0; const rm=new Date(recMon+"T00:00:00Z");
    for (let d=0; d<7; d++){ const dd=new Date(rm); dd.setUTCDate(rm.getUTCDate()+d); c+=idx[dd.toISOString().slice(0,10)]||0; rec.push(Math.round(c)); }
    recLabel = "Record wk ("+rm.toLocaleDateString(undefined,{day:"numeric",month:"short"})+")";
  }
  return {labels, cur, prev, rec, recLabel};
}
function monthCumSeries() {
  const idx = dailyIndex();
  const [Y,Mo] = todayKey().split("-").map(Number);
  const now = new Date(todayKey()+"T00:00:00Z");
  const daysThis = new Date(Date.UTC(Y,Mo,0)).getUTCDate();
  const daysPrev = new Date(Date.UTC(Y,Mo-1,0)).getUTCDate();
  const n = Math.max(daysThis, daysPrev);
  const labels=[], cur=[], prev=[]; let cCur=0, cPrev=0;
  for (let day=1; day<=n; day++) {
    labels.push(String(day));
    if (day<=daysPrev) { const pd=new Date(Date.UTC(Y,Mo-2,day)); cPrev += idx[pd.toISOString().slice(0,10)]||0; }
    prev.push(Math.round(cPrev)); // holds flat after prev month ends
    if (day<=daysThis) { const cd=new Date(Date.UTC(Y,Mo-1,day));
      if (cd<=now) { cCur += idx[cd.toISOString().slice(0,10)]||0; cur.push(Math.round(cCur)); } else cur.push(null); }
    else cur.push(null);
  }
  // record (highest-total) completed calendar month, excluding the current one
  const moTot = monthlyTotals("index"), curMonKey = todayKey().slice(0,7);
  let recKey=null, recMax=0;
  for (const mk in moTot){ if (mk===curMonKey) continue; if (moTot[mk]>recMax){ recMax=moTot[mk]; recKey=mk; } }
  let rec=null, recLabel="";
  if (recKey){ const [ry,rm]=recKey.split("-").map(Number); const daysRec=new Date(Date.UTC(ry,rm,0)).getUTCDate();
    rec=[]; let c=0;
    for (let day=1; day<=n; day++){ if (day<=daysRec) c+=idx[new Date(Date.UTC(ry,rm-1,day)).toISOString().slice(0,10)]||0; rec.push(Math.round(c)); }
    recLabel="Record mo ("+MN[rm-1]+" '"+recKey.slice(2,4)+")"; }
  return {labels, cur, prev, rec, recLabel};
}
function drawCumChart(cvId, legendEl, S, curName, prevName) {
  const cv = document.getElementById(cvId);
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const L = S.labels, pad = {l:44,r:8,t:12,b:22};
  const gw = W-pad.l-pad.r, gh = H-pad.t-pad.b;
  let max=0; for (const v of S.cur) if (v!=null && v>max) max=v; for (const v of S.prev) if (v!=null && v>max) max=v;
  if (S.rec) for (const v of S.rec) if (v!=null && v>max) max=v;
  max = Math.ceil((max||1)*1.1);
  ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+gh); ctx.lineTo(pad.l+gw,pad.t+gh); ctx.stroke();
  ctx.fillStyle="#8b90a0"; ctx.font="10px sans-serif"; ctx.textAlign="right";
  ctx.fillText(max.toLocaleString(), pad.l-4, pad.t+8); ctx.fillText("0", pad.l-4, pad.t+gh);
  ctx.textAlign="center";
  const labelEvery = Math.max(1, Math.round(L.length/8));
  L.forEach((lb,i)=>{ if(i%labelEvery===0||i===L.length-1) ctx.fillText(lb, pad.l+gw*(i/(L.length-1)), pad.t+gh+14); });
  const x = i => pad.l + gw*(i/(L.length-1));
  const y = v => pad.t + gh*(1 - v/max);
  const line = (data, color, width, dash) => {
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]); ctx.lineJoin="round";
    ctx.beginPath(); let started=false;
    data.forEach((v,i)=>{ if(v==null){started=false;return;} started?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)); started=true; });
    ctx.stroke(); ctx.setLineDash([]);
  };
  if (S.rec) line(S.rec, "#fbbf24", 1.8, [2,3]);  // record: gold dotted
  line(S.prev, "#8b90a0", 1.8, [5,4]);   // previous: faded dashed
  line(S.cur,  "#4f9dff", 2.8, null);     // current: bold
  let lg = `<span style="color:#4f9dff">━</span> ${curName} &nbsp;·&nbsp; <span style="color:#8b90a0">╌</span> ${prevName}`;
  if (S.rec) lg += ` &nbsp;·&nbsp; <span style="color:#fbbf24">┈</span> ${S.recLabel}`;
  legendEl.innerHTML = lg + ` &nbsp;(cumulative index)`;
}
// intraday: today's cumulative index by time-of-day vs the average day (all history)
function dayIntradaySeries() {
  const N=24; const labels=[]; for (let h=0; h<=N; h++) labels.push(h+"h");
  const tk=todayKey();
  const wOf=id=>{const ex=state.exercises.find(x=>x.id===id);return ex?ex.weight:1;};
  const hourOf=t=>{const d=new Date(t);return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;};
  let minT=Infinity; for (const e of state.log) if (e.t<minT) minT=e.t;
  const bucket=new Array(N+1).fill(0), todayBucket=new Array(N+1).fill(0);
  for (const e of state.log){ const k=dayKey(e.t); const hb=Math.min(N, Math.ceil(hourOf(e.t)));
    if (k===tk) todayBucket[hb]+=e.reps*wOf(e.ex);
    else if (k>=CUM_SINCE) bucket[hb]+=e.reps*wOf(e.ex); }  // average baseline only since CUM_SINCE
  // count baseline days (>= CUM_SINCE, before today, incl rest days)
  let dCnt=0;
  if (minT<Infinity){ const end=new Date(tk+"T00:00:00Z");
    const startStr = dayKey(minT)>CUM_SINCE ? dayKey(minT) : CUM_SINCE;
    for (let d=new Date(startStr+"T00:00:00Z"); d<end; d.setUTCDate(d.getUTCDate()+1)) dCnt++; }
  dCnt=Math.max(1,dCnt);
  const nowH=Math.ceil(new Date().getHours()+new Date().getMinutes()/60);
  const cur=[], avg=[]; let ca=0, cc=0;
  for (let h=0; h<=N; h++){ ca+=bucket[h]; avg.push(Math.round(ca/dCnt*10)/10);
    cc+=todayBucket[h]; cur.push(h<=nowH ? Math.round(cc) : null); }
  return {labels, cur, prev:avg};
}
function drawCumCharts() {
  drawCumChart("dayCumChart", document.getElementById("dayCumLegend"), dayIntradaySeries(), "Today", "Avg day (since 1 Jul '26)");
  drawCumChart("weekCumChart", document.getElementById("weekCumLegend"), weekCumSeries(), "This week", "Last week");
  drawCumChart("monthCumChart", document.getElementById("monthCumLegend"), monthCumSeries(), "This month", "Last month");
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); chartMode=t.dataset.chart; drawChart();
});
document.querySelectorAll("#horizons .htab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll("#horizons .htab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); chartDays=parseInt(t.dataset.days,10); drawChart();
});
document.querySelectorAll("#monthModes .htab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll("#monthModes .htab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); monthMode=t.dataset.mm; drawMonthChart();
});
document.getElementById("addEx").onclick=()=>{
  const name=document.getElementById("newName").value.trim();
  const weight=parseFloat(document.getElementById("newWeight").value)||1;
  if(!name){toast("Enter a name");return;}
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"_")+"_"+Date.now().toString(36);
  state.exercises.push({id,name,weight,increments:[1,5,10]});
  document.getElementById("newName").value=""; save(); render(); toast("Added "+name);
};
document.getElementById("undoBtn").onclick=undoLast;
document.getElementById("logMore").onclick=()=>{ logShown+=100; renderLog(); };
document.getElementById("exportBtn").onclick=async()=>{
  const name="reptracker-"+todayKey()+".json";
  const json=JSON.stringify(state,null,2);
  const file=new File([json],name,{type:"application/json"});
  // Prefer the native share sheet (iOS: Save to Files / Mail / AirDrop)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  // Fallback: normal file download (desktop / older browsers)
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast("Exported "+name);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=(e)=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.exercises&&d.log){state=d;save();render();toast("Imported");} else toast("Invalid file"); }catch{toast("Invalid file");} };
  r.readAsText(f);
};
window.addEventListener("resize", ()=>{ drawChart(); drawMonthChart(); drawCumCharts(); });
render();
